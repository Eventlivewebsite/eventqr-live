name: Daily Event Lifecycle Cleanup

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EventQR Lifecycle Engine
        run: |
          curl -X GET "https://eventqr-live-admin.vercel.app/api/events/lifecycle" \
            -H "User-Agent: EventQR-Cron-Worker"